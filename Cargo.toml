[package]
name = "arena-stream-rs"
version = "0.1.0"
edition = "2021"
description = "Arena live-stream media server: GStreamer-based ingest, compositing, and multi-output broadcast, replacing the FFmpeg-subprocess Java implementation."

[dependencies]
gstreamer = "0.22"
gstreamer-app = "0.22"
gstreamer-video = "0.22"
gstreamer-audio = "0.22"

tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls"] }

anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

once_cell = "1"
dashmap = "5"
bytes = "1"

# Overlay rendering: switched from tiny-skia to Cairo+Pango (real glyph
# rendering via Pango — see overlay/graphics.rs module docs for why this
# replaces the earlier tiny-skia placeholder-rects approach).
cairo-rs = { version = "0.18", features = ["v1_16"] }
pango = "0.18"
pangocairo = "0.18"
lazy_static = "1.4"

# --- Pins below are only needed to stay buildable on this sandbox's frozen
# rustc 1.75 (Ubuntu noble's packaged toolchain; no rustup access under this
# network policy). On a normal dev machine with a current stable Rust
# toolchain (1.82+), delete this section and run `cargo update`. ---
system-deps = "=6.0.0"
unicode-segmentation = "=1.10.1"
idna = "=0.4.0"
url = "=2.4.1"
toml = "=0.5.11"

[profile.release]
opt-level = 3
lto = true
panic = "unwind"
codegen-units = 1
